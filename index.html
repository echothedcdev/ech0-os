<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#120d20"><title>ECH0 OS</title>
<style>
:root{--accent:#b66cff;--glass:rgba(24,17,39,.88);--line:rgba(255,255,255,.13);font-family:Inter,Segoe UI,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;color:#f7f1ff;overflow:hidden;background:#100b1b}
#desktop{height:100vh;padding:18px;background:radial-gradient(circle at 18% 18%,#59317d 0,transparent 32%),radial-gradient(circle at 85% 80%,#30235d 0,transparent 35%),linear-gradient(135deg,#100b1b,#211333 55%,#080812);background-size:cover}
#top{position:absolute;top:0;left:0;right:0;height:38px;background:#100b1bcc;backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);font-size:13px}
#shortcuts{display:grid;grid-template-columns:repeat(1,78px);gap:14px;margin-top:35px;width:90px}.shortcut{border:0;background:transparent;color:white;padding:8px;border-radius:10px;cursor:pointer}.shortcut:hover{background:#ffffff1c}.shortcut span{display:block;font-size:27px;margin-bottom:5px}.shortcut small{font-size:12px}
#dock{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:9px 12px;background:#171021c9;border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(22px);box-shadow:0 12px 45px #0008}
button{font:inherit;color:inherit;cursor:pointer}#dock button{width:45px;height:43px;border:0;border-radius:12px;background:#ffffff12;font-size:22px}#dock button:hover{background:#ffffff2b;transform:translateY(-4px)}
.panel,.window,.menu{background:var(--glass);border:1px solid var(--line);box-shadow:0 18px 60px #0008;backdrop-filter:blur(24px);border-radius:15px}
#quick{display:none;position:absolute;right:14px;top:48px;width:290px;padding:16px}#start{display:none;position:absolute;bottom:75px;left:50%;transform:translateX(-50%);width:340px;padding:15px}
.tilegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.tile{padding:12px 5px;border:1px solid var(--line);border-radius:10px;background:#ffffff0d;text-align:center}.tile button{background:none;border:0;width:100%}
.window{position:absolute;left:20%;top:14%;width:min(680px,75vw);height:min(490px,70vh);min-width:300px;min-height:220px;display:none;overflow:hidden}.window.active{display:flex;flex-direction:column}.winbar{height:42px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#ffffff0b;border-bottom:1px solid var(--line);cursor:move}.winbar button{border:0;background:#ffffff14;border-radius:7px;padding:4px 9px}.winbody{padding:16px;overflow:auto;flex:1}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.card{background:#ffffff0b;border:1px solid var(--line);padding:13px;border-radius:11px}.action{background:var(--accent);color:#170d24;border:0;border-radius:8px;padding:8px 12px;font-weight:700}.muted{color:#c6b9d5;font-size:13px}input,textarea,select{background:#100b19;color:white;border:1px solid var(--line);border-radius:8px;padding:9px;max-width:100%}textarea{width:100%;min-height:180px}label{display:block;margin:12px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#toast{position:absolute;bottom:85px;right:18px;background:#211632;border:1px solid var(--line);padding:10px 15px;border-radius:10px;display:none}
</style></head>
<body><main id="desktop">
<div id="top"><b>◈ ECH0 OS</b><span id="dateTime"></span><button id="quickBtn">⚙ Quick settings</button></div>
<div id="shortcuts">
<button class="shortcut" onclick="openApp('Files')"><span>📁</span><small>Files</small></button>
<button class="shortcut" onclick="openApp('Browser')"><span>🌐</span><small>Browser</small></button>
<button class="shortcut" onclick="openApp('Settings')"><span>⚙️</span><small>Settings</small></button>
<button class="shortcut" onclick="openApp('Notes')"><span>📝</span><small>Notes</small></button>
<button class="shortcut" onclick="openApp('Tiny Echo')"><span>🤖</span><small>Tiny Echo</small></button>
</div>
<section id="quick" class="panel"><h3>Quick settings</h3><div class="tilegrid">
<div class="tile"><button onclick="toggleTile(this)">📶<br>Wi-Fi</button></div><div class="tile"><button onclick="toggleTile(this)">ᛒ<br>Bluetooth</button></div><div class="tile"><button onclick="toggleTile(this)">🌙<br>Focus</button></div><div class="tile"><button onclick="toggleTile(this)">🛡️<br>Privacy</button></div><div class="tile"><button onclick="toast('Airplane mode toggled')">✈️<br>Airplane</button></div><div class="tile"><button onclick="openApp('Settings')">⚙️<br>Settings</button></div></div><label>Brightness <input type="range" min="40" max="130" value="100" oninput="document.getElementById('desktop').style.filter='brightness('+this.value/100+')'"></label></section>
<section id="start" class="panel"><div class="row"><b>ECH0 menu</b><input id="appSearch" placeholder="Search apps..." oninput="filterApps(this.value)"></div><div class="tilegrid" id="appTiles"></div><p class="muted">ECH0 OS • Your desktop, your rules.</p></section>
<div id="windows"></div>
<div id="dock"><button title="Start" onclick="toggleStart()">◈</button><button onclick="openApp('Files')">📁</button><button onclick="openApp('Browser')">🌐</button><button onclick="openApp('Notes')">📝</button><button onclick="openApp('Music')">🎵</button><button onclick="openApp('Calendar')">📅</button><button onclick="openApp('Calculator')">🧮</button><button onclick="openApp('Tiny Echo')">🤖</button><button onclick="openApp('Settings')">⚙️</button></div><div id="toast"></div>
</main>
<script>
const apps=['Files','Browser','Settings','Notes','Music','Calendar','Calculator','Tiny Echo','App Center','Terminal','About ECH0 OS'];
const icons={'Files':'📁','Browser':'🌐','Settings':'⚙️','Notes':'📝','Music':'🎵','Calendar':'📅','Calculator':'🧮','Tiny Echo':'🤖','App Center':'🛍️','Terminal':'⌨️','About ECH0 OS':'◈'};
const windows=document.getElementById('windows');let z=5;
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>e.style.display='none',2200)}
function toggleStart(){let e=document.getElementById('start');e.style.display=e.style.display==='block'?'none':'block';renderTiles()}
function renderTiles(filter=''){let e=document.getElementById('appTiles');e.innerHTML=apps.filter(a=>a.toLowerCase().includes(filter.toLowerCase())).map(a=>'<div class="tile"><button onclick="openApp('+JSON.stringify(a)+');toggleStart()">'+icons[a]+'<br>'+a+'</button></div>').join('')}
function filterApps(v){renderTiles(v)}
function toggleTile(b){b.style.background=b.style.background?'':'#7045a8';toast(b.innerText.split('\n').pop()+' toggled')}
document.getElementById('quickBtn').onclick=()=>{let q=document.getElementById('quick');q.style.display=q.style.display==='block'?'none':'block'};
function openApp(name){let id='win-'+name.replace(/[^a-z0-9]/gi,'');let old=document.getElementById(id);if(old){old.classList.add('active');old.style.zIndex=++z;return}
let w=document.createElement('section');w.className='window active';w.id=id;w.style.zIndex=++z;w.innerHTML='<header class="winbar"><b>'+icons[name]+' '+name+'</b><div><button onclick="minimizeApp(\''+id+'\')">—</button> <button onclick="closeApp(\''+id+'\')">×</button></div></header><div class="winbody">'+appContent(name)+'</div>';windows.append(w);dragWindow(w);w.addEventListener('pointerdown',()=>w.style.zIndex=++z)}
function closeApp(id){document.getElementById(id)?.remove()}function minimizeApp(id){document.getElementById(id)?.classList.remove('active')}
function dragWindow(w){let bar=w.querySelector('.winbar'),down=false,dx=0,dy=0;bar.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;down=true;dx=e.clientX-w.offsetLeft;dy=e.clientY-w.offsetTop;bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(down){w.style.left=Math.max(0,e.clientX-dx)+'px';w.style.top=Math.max(38,e.clientY-dy)+'px'}});bar.addEventListener('pointerup',()=>down=false)}
function appContent(n){
if(n==='Files')return '<p class="muted">This PC / Home</p><div class="cards">'+['📄 Documents','⬇️ Downloads','🖼️ Pictures','🎵 Music','🎬 Videos','⭐ Favorites'].map(x=>'<div class="card">'+x+'</div>').join('')+'</div><p class="muted">Demo file manager. It does not access your real device files.</p>';
if(n==='Browser')return '<div class="row"><input id="url" style="flex:1" placeholder="Search or enter a website"><button class="action" onclick="goWeb()">Go</button></div><div class="cards"><div class="card">🔎 ECH0 Search</div><div class="card">⭐ Bookmarks</div><div class="card">🕶️ Private window</div></div><iframe id="webview" title="Browser preview" style="width:100%;height:220px;border:1px solid var(--line);border-radius:10px;margin-top:12px;background:white"></iframe><p class="muted">Some websites block embedded previews.</p>';
if(n==='Settings')return '<h2>Personalize ECH0 OS</h2><h3>Appearance</h3><div class="row">'+[['Violet','#100b1b'],['Ocean','#071c35'],['Crimson','#300d19'],['Forest','#0b281e'],['Light','#d8d1e5']].map(([a,c])=>'<button class="tile" onclick="document.getElementById(\'desktop\').style.background=\''+c+'\'">'+a+'</button>').join('')+'</div><label>Accent <input type="color" value="#b66cff" oninput="document.documentElement.style.setProperty(\'--accent\',this.value)"></label><h3>Privacy & security</h3><label><input type="checkbox" checked> Ask before app permissions</label><label><input type="checkbox" checked> Private activity by default</label><label><input type="checkbox"> Share diagnostics (off by default)</label><h3>Tiny Echo</h3><p>Tiny Echo must ask before taking actions.</p><label><input type="checkbox" checked> Ask before opening apps</label><h3>Optional themes</h3><label><input type="checkbox" onchange="toast(this.checked?'Duck Theme enabled':'Duck Theme disabled')"> 🦆 Duck Theme</label><p class="muted">Ducks Everywhere stays off. Ducktopia remains isolated to its own PC.</p>';
if(n==='Notes')return '<textarea id="notes" placeholder="Write something..."></textarea><div class="row"><button class="action" onclick="localStorage.setItem(\'ech0-notes\',document.getElementById(\'notes\').value);toast(\'Notes saved on this browser\')">Save note</button><button onclick="document.getElementById(\'notes\').value=localStorage.getItem(\'ech0-notes\')||\'\'">Load note</button></div>';
if(n==='Music')return '<h3>Local music player</h3><input type="file" accept="audio/*" onchange="playLocal(this)"><audio id="audio" controls style="width:100%;margin-top:15px"></audio><p class="muted">Choose an audio file from your device. It stays in this browser session.</p>';
if(n==='Calendar')return '<h2>'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'</h2><p>Calendar preview</p>';
if(n==='Calculator')return '<input id="calcInput" placeholder="Example: 12*(4+2)"><button class="action" onclick="calculate()">Calculate</button><h2 id="calcResult">Result</h2><p class="muted">Basic arithmetic only.</p>';
if(n==='Tiny Echo')return '<h2>Hello! I am Tiny Echo 🤖</h2><p>I can suggest actions, but I always ask permission before doing anything.</p><button class="action" onclick="if(confirm(\'May I open Settings?\'))openApp(\'Settings\')">Ask Tiny Echo to open Settings</button>';
if(n==='Terminal')return '<p>ECH0 Terminal • safe demo</p><input id="term" placeholder="Try: help, date, version"><button class="action" onclick="terminalRun()">Run</button><pre id="termOut"></pre>';
if(n==='App Center')return '<h2>App Center</h2><div class="cards">'+apps.filter(a=>!['App Center','About ECH0 OS'].includes(a)).map(a=>'<button class="card" onclick="openApp('+JSON.stringify(a)+')">'+icons[a]+' '+a+'</button>').join('')+'</div>';
return '<h2>Welcome to ECH0 OS</h2><p>A futuristic desktop concept by Ecion Co.</p><p class="muted">Browser-based prototype • Version 0.1</p><p>Privacy first. Your desktop, your rules.</p>';
}
function goWeb(){let v=document.getElementById('url').value.trim();if(!v)return;let u=/^https?:\/\//i.test(v)?v:'https://'+v;document.getElementById('webview').src=u}
function playLocal(i){let f=i.files[0];if(f)document.getElementById('audio').src=URL.createObjectURL(f)}
function calculate(){let s=document.getElementById('calcInput').value;if(!/^[0-9+*/().%\s-]+$/.test(s)){toast('Only basic arithmetic is allowed');return}try{document.getElementById('calcResult').textContent=Function('"use strict";return ('+s+')')()}catch{document.getElementById('calcResult').textContent='Invalid expression'}}
function terminalRun(){let c=document.getElementById('term').value.trim(),out={help:'Commands: help, date, version, clear',date:new Date().toString(),version:'ECH0 OS 0.1'};document.getElementById('termOut').textContent=c==='clear'?'':(out[c]||'Unknown command')}
function tick(){document.getElementById('dateTime').textContent=new Date().toLocaleString()}setInterval(tick,1000);tick();renderTiles();openApp('About ECH0 OS');
</script></body></html>
